# Run with `dart run ffigen --config ffigen.yaml`.
name: ZstdBindings
description: |
  Bindings for `src/zstd.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/zstd_bindings_generated.dart'
headers:
  entry-points:
    - 'src/zstd.h'
  include-directives:
    - 'src/zstd.h'
ffi-native:
comments:
  style: any
  length: full
